<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10294d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="股名思義"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>股名思義 Stock Name Quiz</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#13223b;background:#eef3fa}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100dvh;background:#f8fbff;padding:22px 18px 44px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;font-size:24px;color:#123d79}.pill{border-radius:30px;background:#e3edfc;color:#245b9e;padding:7px 11px;font-size:12px}.panel{background:white;border:1px solid #e3eaf4;border-radius:22px;padding:20px;margin-top:18px;box-shadow:0 6px 24px #19385a0b}h1{font-size:25px;margin:8px 0}h2{font-size:20px;margin:0 0 14px}.muted{color:#65758e;font-size:14px}.group{margin:18px 0}.label{display:block;font-weight:750;margin-bottom:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #d8e2f0;border-radius:12px;background:#fff;padding:11px 13px;color:#334b69;font-size:14px;cursor:pointer}.chip.active{background:#173e78;color:white;border-color:#173e78}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;cursor:pointer}.primary{background:#1855a5;color:white}.secondary{background:#e8eff9;color:#194477}.primary:disabled{opacity:.4}.question{text-align:center;padding:28px 8px;background:#eef4fd;border-radius:18px;margin:18px 0}.question .big{font-size:38px;font-weight:850;margin:12px 0}.option{width:100%;text-align:left;border:1px solid #d9e3f0;background:white;border-radius:15px;padding:16px;font-size:18px;font-weight:700;margin:6px 0;cursor:pointer}.option span{display:inline-block;background:#eef3fa;border-radius:8px;padding:7px 10px;margin-right:12px;font-size:14px}.option.good{background:#e7f8ef;border-color:#29a46c}.option.bad{background:#fff0f0;border-color:#dd6464}.option:disabled{color:#26354b}.progress{height:7px;background:#e3eaf4;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#2b6bb7;transition:width .2s}.between{display:flex;justify-content:space-between;gap:8px}.result{text-align:center}.result .score{font-size:56px;font-weight:850;color:#1855a5}.hidden{display:none!important}.feedback{font-weight:750;margin:12px 0}.small{font-size:12px;color:#708098;line-height:1.6}.wrong{border-bottom:1px solid #e5edf5;padding:11px 0}.actions{display:grid;gap:9px;margin-top:16px}.foot{text-align:center;margin:24px 0}.error{color:#ba3e3e}
</style></head><body><main class="app"><div class="top"><div class="brand">📈 股名思義</div><div class="pill">Stock Name Quiz</div></div><section id="home" class="panel"><h1>你認得多少台股？</h1><p class="muted">四選一挑戰股票代碼，答錯的題目還能重練。</p><div class="group"><span class="label">考試類型</span><div class="chips" id="categories"><button class="chip active" data-value="all">上市櫃混合</button><button class="chip" data-value="listed">上市</button><button class="chip" data-value="otc">上櫃</button><button class="chip" data-value="top100">高權值</button><button class="chip" data-value="lowvolume">冷門股</button></div><p class="small" id="categoryStatus"></p></div><div class="group"><span class="label">測驗題型</span><div class="chips" id="modes"><button class="chip active" data-value="mixed">混合測驗</button><button class="chip" data-value="code">代碼猜名稱</button><button class="chip" data-value="name">名稱猜代碼</button></div></div><div class="group"><span class="label">難度</span><div class="chips" id="levels"><button class="chip active" data-value="easy">簡單</button><button class="chip" data-value="hard">困難</button></div></div><div class="group"><span class="label">題數</span><div class="chips" id="counts"><button class="chip active" data-value="10">10 題</button><button class="chip" data-value="20">20 題</button><button class="chip" data-value="30">30 題</button><button class="chip" data-value="50">50 題</button></div></div><button class="primary" id="start">開始挑戰 →</button><div class="actions"><button class="secondary" id="review">錯題複習（<span id="wrongCount">0</span>）</button><button class="secondary" id="history">歷史成績</button></div><div class="group"><span class="label">📚 上市櫃題庫</span><p class="small" id="dataStatus"></p><button class="secondary" id="refreshData" type="button">更新完整上市櫃題庫</button><label class="small" style="display:block;margin-top:12px">或匯入官方 CSV（可同時選擇上市及上櫃兩份）：<input id="csvFiles" type="file" accept=".csv,text/csv" multiple style="display:block;margin-top:7px;max-width:100%"></label><p class="small">高權值股需最新市值排名資料，冷門股需最近 20 個交易日日均成交量資料；缺少資料時不會冒充完整分類。</p></div></section><section id="quiz" class="panel hidden"><button class="secondary" id="quizHome" style="margin-bottom:16px">← 回首頁並結算目前成績</button><div class="between"><b id="counter"></b><b id="liveScore"></b></div><div class="progress" style="margin-top:12px"><div id="bar"></div></div><div class="question"><div class="muted" id="prompt"></div><div class="big" id="stem"></div><div class="pill" id="industry"></div></div><div id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary hidden" id="next">下一題 →</button></section><section id="result" class="panel hidden result"><div style="font-size:44px">🏆</div><h1>挑戰完成！</h1><div class="score" id="finalScore"></div><p id="summary"></p><p class="small" id="resultNote"></p><div class="actions"><button class="primary" id="share">分享成績</button><button class="secondary" id="retry">再玩一次</button><button class="secondary" id="homeBtn">回首頁</button></div></section><section id="records" class="panel hidden"><h2 id="recordTitle"></h2><div id="recordBody"></div><div class="actions"><button class="primary hidden" id="reviewStart">開始錯題複習</button><button class="secondary" id="back">回首頁</button></div></section><div class="foot small">資料僅儲存於目前瀏覽器 · 不需登入</div></main><script src="app.js" defer></script></body></html>
