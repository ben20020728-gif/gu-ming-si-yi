name: Build full stock quiz website

on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * 1-5'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and validate official rosters
        run: python update_stocks.py

      - name: Prepare Netlify-ready website
        run: |
          mkdir -p dist
          cp index.html app.js sw.js manifest.webmanifest icon.png icon-512.png stocks.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: stock-quiz-full-website
          path: dist/
          retention-days: 30
